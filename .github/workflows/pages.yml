name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Yarn via Corepack
        run: corepack enable
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Check ECO browser behavior
        run: node scripts/check-eco-browser.mjs
      - name: Retain ECO measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-browser-report
          path: .consumer-check/eco-report.json
          if-no-files-found: ignore
      - name: Validate packed npm consumers
        run: |
          name=$(npm pack ./package-dist --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(Object.values(JSON.parse(s))[0].filename))')
          mkdir packed
          tar -xzf "$name" -C packed
          node scripts/check-package.mjs packed/package
          node scripts/check-consumers.mjs "$name"
      - name: Assert usage docs
        run: |
          grep -F -q "## Landing page" docs/USAGE.md
          grep -F -q "## Tuner" docs/USAGE.md
          grep -F -q "## React embed demo" docs/USAGE.md
          grep -F -q "## React component" docs/USAGE.md
          grep -F -q "## Vanilla Engine" docs/USAGE.md
          grep -F -q "## Wallpaper Engine" docs/USAGE.md
          grep -F -q "<FluidField" docs/USAGE.md
          grep -F -q "new Engine" docs/USAGE.md
      - name: Assert usage pages
        run: |
          test -f dist/index.html
          test -f dist/play.html
          test -f dist/embed.html
          test -f dist/usage.html
          test -f dist/docs/index.html
          test -f dist/docs/settings.html
          test -f dist/docs/hero.html
          test -f dist/docs/gallery.html
          test -f dist/docs/contributing-presets.html
          test -f dist/component.html
          test -f dist/liquid.html
          test -f dist/diagnostics.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
