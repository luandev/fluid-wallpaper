name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Yarn via Corepack
        run: corepack enable
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Assert usage docs
        run: |
          grep -F -q "## Landing page" docs/USAGE.md
          grep -F -q "## Tuner" docs/USAGE.md
          grep -F -q "## React embed demo" docs/USAGE.md
          grep -F -q "## React component" docs/USAGE.md
          grep -F -q "## Vanilla Engine" docs/USAGE.md
          grep -F -q "## Wallpaper Engine" docs/USAGE.md
          grep -F -q "<FluidField" docs/USAGE.md
          grep -F -q "new Engine" docs/USAGE.md
      - name: Assert usage pages
        run: |
          test -f dist/index.html
          test -f dist/play.html
          test -f dist/embed.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
