<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative Fluid Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #fatal {
        display: none;
        box-sizing: border-box;
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 2rem;
        color: #f2eaea;
        font: 16px/1.5 system-ui, sans-serif;
        background: #1a1a1a;
      }
      #fatal[data-show="true"] {
        display: block;
      }
      .dash {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 2;
        width: min(320px, calc(100vw - 24px));
        max-height: calc(100vh - 72px);
        display: flex;
        flex-direction: column;
        color: #f4ecec;
        background: rgba(12, 12, 14, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
        font: 12px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      .dash[data-open="false"] {
        display: none;
      }
      .dash__header {
        padding: 12px 14px 8px;
      }
      .dash__title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .dash__hint {
        margin: 4px 0 0;
        color: rgba(244, 236, 236, 0.55);
      }
      .dash__body {
        padding: 0 14px 8px;
        overflow: auto;
      }
      .dash__group {
        margin-bottom: 12px;
      }
      .dash__group-title {
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e80818;
      }
      .dash__row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 8px;
      }
      .dash__meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .dash__value {
        color: rgba(244, 236, 236, 0.65);
        font-variant-numeric: tabular-nums;
      }
      .dash__input {
        width: 100%;
        accent-color: #e80818;
      }
      .dash__actions {
        display: flex;
        gap: 8px;
        padding: 8px 14px 12px;
      }
      .dash__btn,
      .dash__fab {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        color: #f4ecec;
        background: #2a1518;
        cursor: pointer;
      }
      .dash__btn {
        flex: 1;
      }
      .dash__fab {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3;
        background: #e80818;
        color: #140404;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="dash" hidden></aside>
    <p id="fatal" role="alert"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
